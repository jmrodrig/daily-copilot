<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evening check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C1216}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.mono{font-family:'IBM Plex Mono',monospace}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0C1216;color:#E8EEF1;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;line-height:1.4">

<div style="padding:24px 20px 8px">
<div class="mono" style="font-size:12px;color:#97A5AE;letter-spacing:0.06em">WED 30 SEP</div>
<h1 style="margin:2px 0 0;font-size:26px;font-weight:600">Evening check-in</h1>
<div style="margin-top:2px;font-size:14px;color:#97A5AE">Tick what got done. The rest carries into tomorrow's ranking.</div>
</div>

<div style="margin:8px 20px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#C5D0D6">
<span><span class="mono" style="color:#F2B544;font-weight:500">{{doneCount}}</span> of {{total}} done</span>
</div>

<ul style="flex:1;min-height:0;list-style:none;margin:8px 0 0;padding:0 20px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="6">
<li>
<button type="button" onClick="{{item.toggle}}" aria-pressed="{{item.pressed}}" style="width:100%;min-height:60px;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;background:#131B21;border:1px solid #25323B;color:#E8EEF1;text-align:left;cursor:pointer">
<span style="width:26px;height:26px;border-radius:7px;border:2px solid #5C6C77;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0;{{item.boxStyle}}">
<sc-if value="{{item.done}}" hint-placeholder-val="{{ true }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10161A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</sc-if>
</span>
<span style="flex:1;min-width:0">
<span style="display:block;font-size:15px;font-weight:500;{{item.titleStyle}}">{{item.title}}</span>
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#97A5AE;margin-top:2px"><span class="dot" style="{{item.dotStyle}}"></span>{{item.tag}}</span>
</span>
</button>
</li>
</sc-for>
</ul>

<div style="padding:10px 20px 14px">
<button type="button" style="width:100%;min-height:52px;border:0;border-radius:12px;background:#F2B544;color:#10161A;font-size:16px;font-weight:600;cursor:pointer">Finish check-in</button>
</div>

<nav aria-label="Primary" style="display:flex;border-top:1px solid #25323B;background:#0F171C;height:72px;flex-shrink:0">
<a href="Capture.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#97A5AE">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>Capture</a>
<a href="Morning.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#97A5AE">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Today</a>
<a href="Evening.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#F2B544">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>Check-in</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: { t1: true, t2: true, t3: false, t4: false, t5: false, t6: false } };
}
renderVals() {
const tasks = [
{ id: 't1', title: 'Stability booklet — freeboard check', tag: 'Project A', dot: '#6CB6EA' },
{ id: 't2', title: 'Reply to notified body query', tag: 'P5002', dot: '#56C8A8' },
{ id: 't3', title: 'Review GA rev C comments', tag: 'Project B', dot: '#B7A3F2' },
{ id: 't4', title: 'Update hull scantling sheet', tag: 'Project A', dot: '#6CB6EA' },
{ id: 't5', title: 'Prep: Friday design review', tag: 'Meeting', dot: '#97A5AE' },
{ id: 't6', title: 'Call yard about hatch detail', tag: 'Ad hoc', dot: '#6B7A84' }
];
const doneMap = this.state.done;
const items = tasks.map((t) => {
const d = !!doneMap[t.id];
return {
title: t.title,
tag: t.tag,
done: d,
pressed: d ? 'true' : 'false',
dotStyle: 'background:' + t.dot,
boxStyle: d ? 'background:#F2B544;border-color:#F2B544' : 'background:transparent',
titleStyle: d ? 'color:#97A5AE;text-decoration:line-through' : 'color:#E8EEF1',
toggle: () => this.setState({ done: { ...this.state.done, [t.id]: !d } })
};
});
return { items, doneCount: items.filter((i) => i.done).length, total: tasks.length };
}
}
</script>
</body>
</html>
